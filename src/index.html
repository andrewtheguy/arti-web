<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arti Onion POC</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 system-ui, sans-serif; background: #14131a; color: #e7e5ee;
  }
  .card {
    width: min(92vw, 560px); background: #1e1c27; border: 1px solid #322f40;
    border-radius: 14px; padding: 28px 30px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 22px; color: #9a96ad; font-size: 14px; }
  button {
    appearance: none; border: 0; border-radius: 9px; cursor: pointer;
    background: #7c5cff; color: #fff; font-size: 15px; font-weight: 600;
    padding: 11px 18px;
  }
  button:disabled { opacity: .5; cursor: progress; }
  .out {
    margin-top: 20px; padding: 14px 16px; border-radius: 9px;
    background: #14131a; border: 1px solid #322f40;
    font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap;
  }
  .ok { color: #5ce08a; } .err { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧅 Arti Onion Service POC</h1>
    <p class="sub">This page is served over a Tor hidden service. The box below is filled
      by JavaScript via an AJAX <code>fetch()</code> to the backend.</p>
    <button id="btn">Call backend (/api/ping)</button>
    <div class="out" id="out">Loading…</div>
  </div>

<script>
  const out = document.getElementById('out');
  const btn = document.getElementById('btn');

  async function ping() {
    btn.disabled = true;
    out.className = 'out';
    out.textContent = 'Requesting /api/ping …';
    try {
      const t0 = performance.now();
      const res = await fetch('/api/ping', { cache: 'no-store' });
      const data = await res.json();
      const ms = Math.round(performance.now() - t0);
      out.className = 'out ok';
      out.textContent =
        '✓ AJAX round-trip OK (' + ms + ' ms over Tor)\n\n' +
        JSON.stringify(data, null, 2);
    } catch (e) {
      out.className = 'out err';
      out.textContent = '✗ Request failed: ' + e;
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', ping);
  ping(); // fire once on load to prove JS + AJAX work automatically
</script>
</body>
</html>
